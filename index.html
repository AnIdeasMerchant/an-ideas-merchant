<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Client Portals · An Ideas Merchant</title>
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; background:var(--aim-black); color:var(--aim-ivory); font-family:var(--font-body); padding:40px; }
  .wrap { width:min(420px, 100%); }
  .word { font-size:11px; letter-spacing:0.16em; text-transform:uppercase; color:var(--aim-muted); margin:0 0 10px; }
  h1 { font-family:var(--font-display); font-weight:600; letter-spacing:-0.02em; font-size:32px; margin:0 0 28px; }
  a.client-link { display:block; border:1px solid var(--aim-hairline-ivory); border-radius:12px; padding:16px 20px; margin-bottom:12px; color:var(--aim-ivory); transition:border-color 0.28s; }
  a.client-link:hover { border-color:var(--aim-gold); color:var(--aim-gold); }
</style>
</head>
<body>
<div class="wrap">
  <p class="word">An Ideas Merchant</p>
  <h1>Client Portals</h1>
  <a class="client-link" href="./simone/">Simone</a>
  <a class="client-link" href="./kat/">Kat</a>
</div>
</body>
</html>
